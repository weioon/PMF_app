<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MyPFM — Bilingual Personal Financial Management (EN / 中文)</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="local-db.js"></script>
  <style>
    body {
      font-family: 'Inter', 'PingFang SC', 'Microsoft YaHei', system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .numpad-key:active, .tap-scale:active { transform: scale(0.97); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-28 select-none sm:select-auto">

  <!-- PWA / App Update Available Toast Banner -->
  <div id="pwa-update-banner" class="hidden sticky top-0 z-50 bg-emerald-500 text-slate-950 px-3.5 py-2 text-xs font-extrabold flex items-center justify-between shadow-lg">
    <span id="pwa-update-text">New code update ready! Your local financial data is 100% preserved.</span>
    <button onclick="applySwUpdateNow()" class="px-3 py-1 rounded-lg bg-slate-950 text-emerald-400 font-black">Update Now</button>
  </div>

  <!-- Top Mobile App Bar -->
  <header class="sticky top-0 z-40 backdrop-blur-lg bg-slate-900/95 border-b border-slate-800 px-3.5 py-2.5">
    <div class="max-w-5xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 min-w-0">
        <div class="w-9 h-9 shrink-0 rounded-xl bg-gradient-to-br from-emerald-400 to-teal-600 flex items-center justify-center font-black text-slate-950 text-sm shadow-md">
          RM
        </div>
        <div class="truncate">
          <div class="flex items-center gap-1.5">
            <h1 id="app-title" class="text-sm sm:text-base font-extrabold tracking-tight text-white truncate"></h1>
            <span id="badge-offline-db" class="px-1.5 py-0.5 rounded bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-[9px] font-black uppercase tracking-wider shrink-0">IndexedDB Local</span>
          </div>
          <p id="app-subtitle" class="text-[11px] text-slate-400 truncate"></p>
        </div>
      </div>

      <div class="flex items-center gap-1.5 shrink-0">
        <!-- Backup / Restore Quick Button -->
        <button onclick="switchTab('backup')" class="tap-scale px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-emerald-500/40 text-emerald-300 text-xs font-bold flex items-center gap-1" title="JSON Backup & Restore">
          <span>💾</span>
          <span id="lbl-backup-btn" class="hidden sm:inline">Backup</span>
        </button>

        <!-- Alert Bell Badge -->
        <button onclick="switchTab('alerts')" class="tap-scale relative px-2.5 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold flex items-center gap-1">
          <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
          <span id="lbl-alert-bell" class="hidden xs:inline"></span>
          <span id="badge-alert-count" class="px-1.5 py-0.2 rounded-full bg-rose-500 text-white text-[10px] font-black">0</span>
        </button>

        <!-- 1-Tap EN / 中文 Language Switcher -->
        <div class="inline-flex rounded-xl bg-slate-800 p-0.5 border border-slate-700">
          <button id="btn-lang-en" onclick="setLanguage('en')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all">EN</button>
          <button id="btn-lang-zh" onclick="setLanguage('zh-CN')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition-all">中文</button>
        </div>
      </div>
    </div>

    <!-- Scrollable Sub-Navigation Pills for Secondary Views -->
    <nav class="max-w-5xl mx-auto mt-2.5 flex gap-1.5 overflow-x-auto no-scrollbar pb-0.5">
      <button onclick="switchTab('dashboard')" id="tab-btn-dashboard" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all"></button>
      <button onclick="switchTab('categories')" id="tab-btn-categories" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all"></button>
      <button onclick="switchTab('calendar')" id="tab-btn-calendar" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all"></button>
      <button onclick="switchTab('envelopes')" id="tab-btn-envelopes" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all"></button>
      <button onclick="switchTab('installments')" id="tab-btn-installments" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all"></button>
      <button onclick="switchTab('asnb')" id="tab-btn-asnb" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all"></button>
      <button onclick="switchTab('alerts')" id="tab-btn-alerts" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all"></button>
      <button onclick="switchTab('backup')" id="tab-btn-backup" class="px-3 py-1.5 rounded-xl text-xs font-semibold whitespace-nowrap transition-all"></button>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto px-3.5 pt-4 space-y-5">
    <!-- TAB 1: 4-PILLAR ROLL-UP DASHBOARD & DIRECT ACCOUNT BALANCE EDITOR -->
    <section id="view-dashboard" class="space-y-4">
      <div id="kpi-cards-grid" class="grid grid-cols-2 lg:grid-cols-4 gap-2.5"></div>

      <!-- 4-Pillar Filter & Account List (Tap any account to edit balance!) -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-3.5 sm:p-4 space-y-3.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 id="pillars-section-title" class="text-sm font-extrabold text-white"></h2>
            <p id="pillars-edit-hint" class="text-[11px] text-emerald-400 font-medium"></p>
          </div>
          <button onclick="openCreateAccountModal()" id="btn-add-custom-acc" class="tap-scale px-3 py-1.5 rounded-xl bg-emerald-500 text-slate-950 font-extrabold text-xs shadow"></button>
        </div>

        <div class="flex gap-1.5 overflow-x-auto no-scrollbar pb-1" id="pillar-selector-tabs"></div>
        <div id="pillars-rollup-grid" class="grid grid-cols-1 md:grid-cols-2 gap-3.5"></div>
      </div>

      <!-- Pending Split-Bill Reimbursements & LHDN Tax Relief Quick View -->
      <div class="grid grid-cols-1 lg:grid-cols-2 gap-3.5">
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <h3 id="reimbursements-title" class="text-sm font-bold text-white mb-2.5"></h3>
          <div id="reimbursements-list" class="space-y-2"></div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
          <h3 id="tax-view-title" class="text-sm font-bold text-white mb-2.5"></h3>
          <div id="tax-buckets-container" class="space-y-2.5"></div>
        </div>
      </div>
    </section>

    <!-- TAB 2: CATEGORY ROLL-UP SUMMARIES & VELOCITY DAILY CAPS -->
    <section id="view-categories" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h2 id="cat-rollup-title" class="text-base font-bold text-white mb-1"></h2>
        <p id="cat-rollup-subtitle" class="text-xs text-slate-400 mb-3.5"></p>
        <div id="category-rollup-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </section>

    <!-- TAB 3: 30-DAY CASHFLOW PROJECTION CALENDAR -->
    <section id="view-calendar" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5">
        <div>
          <h2 id="cal-view-title" class="text-base font-bold text-white"></h2>
          <p id="cal-view-subtitle" class="text-xs text-slate-400"></p>
        </div>
        <div id="cashflow-calendar-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 lg:grid-cols-6 gap-2"></div>
      </div>
    </section>

    <!-- TAB 4: VIRTUAL ENVELOPES (SINKING FUNDS) -->
    <section id="view-envelopes" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <h2 id="env-view-title" class="text-base font-bold text-white mb-1"></h2>
        <p id="env-formula-bar" class="text-[11px] font-mono text-emerald-300 bg-slate-950 px-3 py-2 rounded-lg border border-slate-800 mb-3.5 break-words"></p>
        <div id="envelopes-breakdown-container" class="space-y-3.5"></div>
      </div>
    </section>

    <!-- TAB 5: INSTALLMENT SCHEDULE GENERATOR (SPAYLATER RM 150 / 3M) & DSR % -->
    <section id="view-installments" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4">
        <div class="flex flex-wrap items-center justify-between gap-2 mb-3.5">
          <div>
            <h2 id="inst-view-title" class="text-base font-bold text-white"></h2>
            <p id="inst-view-subtitle" class="text-xs text-slate-400"></p>
          </div>
          <button onclick="createSpayLater150Plan()" id="btn-create-spaylater" class="tap-scale px-3.5 py-2 rounded-xl bg-indigo-500 hover:bg-indigo-400 text-white text-xs font-bold shadow"></button>
        </div>
        <div id="dsr-gauge-panel" class="mb-3.5"></div>
        <div id="installment-plans-container" class="space-y-3.5"></div>
      </div>
    </section>

    <!-- TAB 6: ASNB DIVIDEND PROJECTOR & DAILY COMPOUNDING VIEW -->
    <section id="view-asnb" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 id="asnb-view-title" class="text-base font-bold text-white"></h2>
            <p id="asnb-rule-formula" class="text-[11px] font-mono text-teal-300 mt-0.5"></p>
          </div>
          <button onclick="simulateAfter1stAsnbDeposit()" id="btn-sim-asnb-after1st" class="tap-scale px-3 py-1.5 rounded-xl bg-teal-500 hover:bg-teal-400 text-slate-950 text-xs font-bold"></button>
        </div>
        <div id="asnb-cards-container"></div>
      </div>
    </section>

    <!-- TAB 7: ALERT NOTIFICATION CENTER (RULE A, B, C, D & TIMING TIPS) -->
    <section id="view-alerts" class="hidden space-y-4">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 space-y-3.5">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 id="alerts-center-title" class="text-base font-bold text-white"></h2>
            <p id="alerts-center-subtitle" class="text-xs text-slate-400"></p>
          </div>
          <div class="flex flex-wrap gap-1.5">
            <button onclick="simulateTngDropBelow10()" id="btn-sim-tng" class="px-2.5 py-1.5 rounded-lg bg-rose-500/20 border border-rose-500/40 text-rose-200 text-xs font-semibold"></button>
            <button onclick="simulateBankAAutoDebitShortfall()" id="btn-sim-autodebit" class="px-2.5 py-1.5 rounded-lg bg-amber-500/20 border border-amber-500/40 text-amber-200 text-xs font-semibold"></button>
            <button onclick="resetGuardrailDemo()" id="btn-sim-reset" class="px-2.5 py-1.5 rounded-lg bg-slate-800 border border-slate-700 text-slate-300 text-xs font-semibold"></button>
          </div>
        </div>
        <div id="alerts-container" class="grid grid-cols-1 md:grid-cols-2 gap-3"></div>
      </div>
    </section>

    <!-- TAB 8: STANDALONE STORAGE, JSON BACKUP / RESTORE & DOUBLE-ENTRY AUDIT LOG -->
    <section id="view-backup" class="hidden space-y-4">
      <div class="bg-slate-900 border border-emerald-500/40 rounded-2xl p-4 space-y-4">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 id="backup-view-title" class="text-base font-extrabold text-white"></h2>
            <p id="backup-view-subtitle" class="text-xs text-slate-400 mt-0.5"></p>
          </div>
          <span class="px-2.5 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold">100% Offline Device DB</span>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
          <!-- Export Card -->
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
            <h3 id="backup-export-title" class="text-sm font-bold text-emerald-400"></h3>
            <p id="backup-export-desc" class="text-xs text-slate-400 leading-relaxed"></p>
            <div class="flex flex-wrap gap-2">
              <button onclick="downloadJsonBackup()" id="btn-download-json" class="tap-scale px-4 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black text-xs shadow"></button>
              <button onclick="copyJsonBackupToClipboard()" id="btn-copy-json" class="tap-scale px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold text-xs border border-slate-700"></button>
            </div>
          </div>

          <!-- Import / Restore Card -->
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
            <h3 id="backup-import-title" class="text-sm font-bold text-sky-400"></h3>
            <p id="backup-import-desc" class="text-xs text-slate-400 leading-relaxed"></p>
            <div class="flex flex-wrap items-center gap-2">
              <input type="file" id="inp-restore-file" accept=".json,application/json" onchange="handleRestoreFileSelect(event)" class="hidden" />
              <button onclick="document.getElementById('inp-restore-file').click()" id="btn-upload-json" class="tap-scale px-4 py-2.5 rounded-xl bg-sky-500 hover:bg-sky-400 text-slate-950 font-black text-xs shadow"></button>
              <button onclick="checkForSwUpdateManual()" id="btn-check-pwa-update" class="tap-scale px-3.5 py-2.5 rounded-xl bg-slate-800 hover:bg-slate-700 text-teal-300 font-bold text-xs border border-teal-500/40"></button>
            </div>
          </div>
        </div>

        <p id="backup-status-msg" class="hidden text-xs font-bold text-emerald-400 bg-emerald-950/40 border border-emerald-500/40 px-3 py-2 rounded-xl"></p>

        <!-- Double-Entry Ledger Transaction Log -->
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-2.5">
          <h3 id="tx-history-title" class="text-sm font-bold text-white"></h3>
          <div id="tx-history-list" class="space-y-2 max-h-72 overflow-y-auto"></div>
        </div>
      </div>
    </section>
  </main>

  <!-- MODAL 1: EDIT ACCOUNT BALANCE, FLOOR, ENVELOPES & AUTO-DEBITS (BOTTOM SHEET) -->
  <div id="edit-account-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl space-y-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <div>
          <span id="edit-acc-pillar-badge" class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-emerald-500/20 text-emerald-300"></span>
          <h3 id="edit-acc-modal-title" class="text-base font-extrabold text-white mt-1"></h3>
        </div>
        <button onclick="closeEditAccountModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 hover:text-white font-bold">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label id="lbl-edit-name-en" class="block text-slate-400 mb-1 font-semibold"></label>
          <input id="inp-edit-name-en" type="text" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-semibold text-sm focus:border-emerald-400 outline-none" />
        </div>
        <div>
          <label id="lbl-edit-name-zh" class="block text-slate-400 mb-1 font-semibold"></label>
          <input id="inp-edit-name-zh" type="text" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-semibold text-sm focus:border-emerald-400 outline-none" />
        </div>

        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label id="lbl-edit-balance" class="block text-emerald-300 mb-1 font-bold"></label>
            <input id="inp-edit-balance" type="number" step="0.01" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-emerald-500/50 text-emerald-400 font-black text-base focus:border-emerald-400 outline-none" />
          </div>
          <div id="wrap-edit-min-floor">
            <label id="lbl-edit-floor" class="block text-rose-300 mb-1 font-bold"></label>
            <input id="inp-edit-floor" type="number" step="0.01" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-bold text-base focus:border-rose-400 outline-none" />
          </div>
        </div>

        <div id="wrap-edit-asnb-fields" class="hidden grid grid-cols-2 gap-2.5 pt-1">
          <div>
            <label id="lbl-edit-lowest-bal" class="block text-teal-300 mb-1 font-bold"></label>
            <input id="inp-edit-lowest-bal" type="number" step="0.01" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-teal-500/40 text-teal-300 font-bold text-sm outline-none" />
          </div>
          <div>
            <label id="lbl-edit-rate" class="block text-slate-400 mb-1 font-bold"></label>
            <input id="inp-edit-rate" type="number" step="0.01" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white font-bold text-sm outline-none" />
          </div>
        </div>

        <!-- Quick Virtual Envelope Editor inside Liquid Account -->
        <div id="wrap-edit-envelopes" class="hidden pt-2 border-t border-slate-800 space-y-2">
          <div class="flex items-center justify-between">
            <span id="lbl-edit-env-header" class="font-bold text-sky-300"></span>
            <button onclick="addEnvelopeInModal()" id="btn-add-env-modal" class="px-2 py-1 rounded-lg bg-sky-500/20 text-sky-300 font-bold text-[11px]"></button>
          </div>
          <div id="edit-acc-envelopes-list" class="space-y-1.5"></div>
        </div>
      </div>

      <div class="flex gap-2 pt-2">
        <button onclick="deleteAccountFromModal()" id="btn-delete-acc" class="px-3.5 py-3 rounded-2xl bg-rose-950/70 hover:bg-rose-900 border border-rose-500/40 text-rose-300 font-bold text-xs"></button>
        <button onclick="saveEditAccountModal()" id="btn-save-edit-acc" class="flex-1 py-3 rounded-2xl bg-gradient-to-r from-emerald-400 to-teal-500 text-slate-950 font-black text-sm shadow-lg"></button>
      </div>
    </div>
  </div>

  <!-- MODAL 2: CREATE NEW CUSTOM SUB-TYPE & ACCOUNT (BOTTOM SHEET) -->
  <div id="create-account-modal" class="fixed inset-0 z-50 hidden bg-slate-950/80 backdrop-blur-sm flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border-t sm:border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl space-y-3.5 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between border-b border-slate-800 pb-2.5">
        <h3 id="create-acc-modal-title" class="text-base font-extrabold text-white"></h3>
        <button onclick="closeCreateAccountModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-300 font-bold">✕</button>
      </div>

      <div class="space-y-3 text-xs">
        <div>
          <label id="lbl-new-pillar" class="block text-slate-400 mb-1 font-semibold"></label>
          <select id="inp-new-pillar" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-bold text-xs">
            <option value="ASSET_LIQUID">1. ASSET_LIQUID (Bank / e-Wallet / TNG NFC / Cash)</option>
            <option value="ASSET_INVESTMENT">2. ASSET_INVESTMENT (ASNB / FD / StashAway / EPF)</option>
            <option value="LIABILITY">3. LIABILITY (SPayLater / Credit Card / Loan)</option>
            <option value="INCOME_SOURCE">4. INCOME_SOURCE (Salary / Freelance / Dividend)</option>
          </select>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label id="lbl-new-subtype-en" class="block text-slate-400 mb-1"></label>
            <input id="inp-new-subtype-en" type="text" placeholder="e.g. e-Wallets" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white text-xs" />
          </div>
          <div>
            <label id="lbl-new-subtype-zh" class="block text-slate-400 mb-1"></label>
            <input id="inp-new-subtype-zh" type="text" placeholder="例如：电子钱包" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white text-xs" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label id="lbl-new-name-en" class="block text-slate-400 mb-1"></label>
            <input id="inp-new-name-en" type="text" placeholder="e.g. GrabPay Wallet" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white text-xs" />
          </div>
          <div>
            <label id="lbl-new-name-zh" class="block text-slate-400 mb-1"></label>
            <input id="inp-new-name-zh" type="text" placeholder="例如：GrabPay 钱包" class="w-full px-3 py-2 rounded-xl bg-slate-950 border border-slate-700 text-white text-xs" />
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label id="lbl-new-balance" class="block text-emerald-300 font-bold mb-1"></label>
            <input id="inp-new-balance" type="number" step="0.01" value="100.00" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-emerald-500/50 text-emerald-400 font-black text-sm" />
          </div>
          <div>
            <label id="lbl-new-floor" class="block text-rose-300 font-bold mb-1"></label>
            <input id="inp-new-floor" type="number" step="0.01" value="10.00" class="w-full px-3 py-2.5 rounded-xl bg-slate-950 border border-slate-700 text-white font-bold text-sm" />
          </div>

    const STORAGE_KEY = 'mypfm_data_v2';
    function getSerializableState() {
      return {
        accounts: state.accounts,
        categories: state.categories,
        installmentPlans: state.installmentPlans,
        reimbursements: state.reimbursements,
        taxBuckets: state.taxBuckets,
        transactions: state.transactions,
        asnbSnapshots: state.asnbSnapshots,
        netMonthlyIncome: state.netMonthlyIncome,
        lang: state.lang
      };
    }

    function applySavedDataToState(saved) {
      if (!saved) return;
      if (saved.accounts && saved.accounts.length) state.accounts = saved.accounts;
      if (saved.categories && saved.categories.length) state.categories = saved.categories;
      if (saved.installmentPlans) state.installmentPlans = saved.installmentPlans;
      if (saved.reimbursements) state.reimbursements = saved.reimbursements;
      if (saved.taxBuckets) state.taxBuckets = saved.taxBuckets;
      if (saved.transactions) state.transactions = saved.transactions;
      if (saved.asnbSnapshots) state.asnbSnapshots = saved.asnbSnapshots;
      if (saved.netMonthlyIncome) state.netMonthlyIncome = saved.netMonthlyIncome;
      if (saved.lang) state.lang = saved.lang;
    }

    function saveToStorage() {
      const snapshot = getSerializableState();
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(snapshot));
      } catch (e) {}
      if (window.PfmLocalDb) {
        window.PfmLocalDb.saveFullState(snapshot).catch(() => {});
      }
    }

    function loadFromStorage() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          applySavedDataToState(JSON.parse(raw));
        }
      } catch (e) {}
      if (window.PfmLocalDb) {
        window.PfmLocalDb.loadFullState().then((idbData) => {
          if (idbData && idbData.accounts && idbData.accounts.length) {
            applySavedDataToState(idbData);
            renderAll();
          }
        }).catch(() => {});
      }
    }
    loadFromStorage();

    function isZh() { return state.lang === 'zh-CN'; }
    function loc(en, zh) { return isZh() ? zh : en; }
    function fmtRM(val) { return 'RM ' + Number(val || 0).toLocaleString('en-MY', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }

    function calcSafeToSpend(acc) {
      if (window.PfmDomainEngine) {
        return window.PfmDomainEngine.calculateUnrestrictedSpendableBalance(acc, state.installmentPlans);
      }
      if (acc.pillar !== 'ASSET_LIQUID') return 0;
      const envSum = (acc.envelopes || []).reduce((s, e) => s + Number(e.allocated || 0), 0);
      const debitSum = (acc.autoDebits || []).reduce((s, d) => s + Number(d.amount || 0), 0);
      return Math.max(0, Number((acc.currentBalance - acc.minBalanceLimit - envSum - debitSum).toFixed(2)));
    }

    // =========================================================================
    // GUARDRAILS EVALUATION (RULE A, B, C, D)
    // =========================================================================
    function evaluateLocalizedAlerts() {
      const alerts = [];

      // Rule A: Static Operational Floor (e.g., Touch 'n Go NFC Card < RM 10.00)
      state.accounts.filter(a => a.pillar === 'ASSET_LIQUID' && a.minBalanceLimit > 0).forEach(acc => {
        if (acc.currentBalance < acc.minBalanceLimit) {
          const shortfall = Number((acc.minBalanceLimit - acc.currentBalance).toFixed(2));
          const donor = state.accounts.find(x => x.pillar === 'ASSET_LIQUID' && x.id !== acc.id && calcSafeToSpend(x) >= shortfall);
          alerts.push({
            ruleCode: 'RULE_A_STATIC_FLOOR',
            translationKey: 'ALERT.STATIC_FLOOR_BREACH',
            color: 'rose',
            title: isZh() ? `${acc.nameZh} 余额不足预警` : `${acc.nameEn} Low Balance Alert`,
            body: isZh()
              ? `${acc.nameZh} 当前余额 (${fmtRM(acc.currentBalance)}) 已低于最低安全限额 ${fmtRM(acc.minBalanceLimit)}。请立即充值至少 ${fmtRM(shortfall)}，以免影响过路费或停车刷卡。`
              : `${acc.nameEn} balance (${fmtRM(acc.currentBalance)}) is below its operational floor of ${fmtRM(acc.minBalanceLimit)}. Top up at least ${fmtRM(shortfall)} immediately for toll/parking gates.`,
            actionLabel: donor ? (isZh() ? `一键从 ${donor.nameZh} 充值 ${fmtRM(shortfall)}` : `Top Up ${fmtRM(shortfall)} from ${donor.nameEn}`) : null,
            onAction: donor ? () => executeQuickTransfer(donor.id, acc.id, shortfall) : null
          });
        }
      });

      // Rule B: Auto-Debit Look-Ahead + Donor Surplus Suggestion
      state.accounts.filter(a => a.pillar === 'ASSET_LIQUID').forEach(acc => {
        const autoDebitSum = (acc.autoDebits || []).reduce((s, d) => s + d.amount, 0);
        if (autoDebitSum > 0) {
          const required = Number((acc.minBalanceLimit + autoDebitSum).toFixed(2));
          if (acc.currentBalance < required) {
            const shortfall = Number((required - acc.currentBalance).toFixed(2));
            const donor = state.accounts
              .filter(x => x.pillar === 'ASSET_LIQUID' && x.id !== acc.id && calcSafeToSpend(x) >= shortfall)
              .sort((a, b) => (b.isZeroInterestLiquid ? 1 : 0) - (a.isZeroInterestLiquid ? 1 : 0))[0];
            const donorName = donor ? loc(donor.nameEn, donor.nameZh) : loc('Reserve Account', '备用账户');
            const commitName = acc.autoDebits.map(d => loc(d.nameEn, d.nameZh)).join(', ');

            alerts.push({
              ruleCode: 'RULE_B_AUTODEBIT_LOOKAHEAD',
              translationKey: 'ALERT.LOW_AUTODEBIT_BALANCE',
              color: 'amber',
              title: isZh() ? '自动扣款余额不足提醒' : 'Upcoming Auto-Debit Shortfall Warning',
              body: isZh()
                ? `${acc.nameZh} 在未来 7 天内需扣款【${commitName}】共需 ${fmtRM(required)}（含最低限额 ${fmtRM(acc.minBalanceLimit)}），当前余额仅 ${fmtRM(acc.currentBalance)}。智能建议：立即从 ${donorName} 转入 ${fmtRM(shortfall)}。`
                : `${acc.nameEn} needs ${fmtRM(required)} (including ${fmtRM(acc.minBalanceLimit)} floor) for ${commitName} within 7 days, but only holds ${fmtRM(acc.currentBalance)}. Suggested: Transfer ${fmtRM(shortfall)} from ${donorName}.`,
              actionLabel: donor ? (isZh() ? `一键从 ${donor.nameZh} 转入 ${fmtRM(shortfall)}` : `Transfer ${fmtRM(shortfall)} from ${donor.nameEn}`) : null,
              onAction: donor ? () => executeQuickTransfer(donor.id, acc.id, shortfall) : null
            });
          }
        }
      });

      // Rule C: Month-End Idle Cash Sweeper (25th - 31st)
      const bankB = state.accounts.find(a => a.id === 'bank-b');
      const asnb = state.accounts.find(a => a.id === 'asnb-fixed');
      if (bankB && asnb) {
        const surplus = calcSafeToSpend(bankB);
        if (surplus >= 100) {
          const estMonthlyDiv = ((surplus * (asnb.annualRate / 100)) / 12).toFixed(2);
          alerts.push({
            ruleCode: 'RULE_C_IDLE_CASH_SWEEPER',
            translationKey: 'ALERT.IDLE_CASH_SWEEPER',
            color: 'emerald',
            title: isZh() ? '月末闲置资金转入 ASNB 智能建议' : 'Month-End ASNB Idle Cash Sweeper',
            body: isZh()
              ? `扣除所有储蓄信封与最低安全限额后，${bankB.nameZh} 仍有 ${fmtRM(surplus)} 零息闲置资金。建议在次月1日前转入 ${asnb.nameZh}，按年化 ${asnb.annualRate}% 预计每月可多赚取 RM ${estMonthlyDiv} 分红。`
              : `After all buffers and envelopes, ${bankB.nameEn} holds ${fmtRM(surplus)} in 0% idle cash. Sweep to ${asnb.nameEn} before the 1st of next month to earn ~RM ${estMonthlyDiv}/mo in dividends.`,
            actionLabel: isZh() ? `将 RM 500 闲置资金转入 ASNB` : `Sweep RM 500 Idle Cash to ASNB`,
            onAction: () => executeQuickTransfer('bank-b', 'asnb-fixed', 500.00)
          });
        }
      }

      return alerts;
    }

    function executeQuickTransfer(sourceId, destId, amount) {
      const src = state.accounts.find(a => a.id === sourceId);
      const dst = state.accounts.find(a => a.id === destId);
      if (!src || !dst || src.currentBalance < amount) return;
      src.currentBalance = Number((src.currentBalance - amount).toFixed(2));
      dst.currentBalance = Number((dst.currentBalance + amount).toFixed(2));
      renderAll();
    }

    function pressNumpadKey(k) {

      } else if (k === '.') {
        if (!state.numpadRaw.includes('.')) state.numpadRaw += '.';
      } else {
        state.numpadRaw = state.numpadRaw === '0' || state.numpadRaw === '50.00' || state.numpadRaw === '150.00'
          ? k
          : state.numpadRaw + k;
      }

    function submitNumpadTransaction() {
      const amt = parseFloat(state.numpadRaw) || 0;
      if (amt <= 0) return;
      const todayStr = new Date().toISOString().slice(0, 10);

      if (state.numpadMode === 'EXPENSE') {
        const srcId = document.getElementById('np-sel-source')?.value || state.npSourceAccountId;
        const catId = document.getElementById('np-sel-cat')?.value || state.npCategoryId;
        const srcAcc = state.accounts.find(a => a.id === srcId);
        const cat = state.categories.find(c => c.id === catId);
        if (srcAcc) {
          const prevBal = srcAcc.currentBalance;
          if (srcAcc.pillar === 'LIABILITY') {
            srcAcc.currentBalance = Number((srcAcc.currentBalance + amt).toFixed(2));
          } else {
            srcAcc.currentBalance = Math.max(0, Number((srcAcc.currentBalance - amt).toFixed(2)));
          }
          if (window.PfmDomainEngine) {
            window.PfmDomainEngine.updateAsnbSnapshotOnBalanceChange(srcAcc, prevBal, srcAcc.currentBalance, new Date());
          }
        }
        if (cat) {
          cat.directSpent = Number((cat.directSpent + amt).toFixed(2));
        }
        state.transactions.unshift({
          id: 'tx-' + Date.now(),
          date: todayStr,
          type: 'EXPENSE',
          amount: amt,
          personalAmount: amt,
          descEn: `Expense (${cat ? cat.nameEn : 'General'}) paid from ${srcAcc ? srcAcc.nameEn : 'Account'}`,
          descZh: `日常支出 (${cat ? cat.nameZh : '通用'}) 扣自 ${srcAcc ? srcAcc.nameZh : '账户'}`
        });
      } else if (state.numpadMode === 'TRANSFER') {
        const srcId = document.getElementById('np-sel-source')?.value || state.npSourceAccountId;
        const dstId = document.getElementById('np-sel-dest')?.value || state.npDestAccountId;
        const srcAcc = state.accounts.find(a => a.id === srcId);
        const dstAcc = state.accounts.find(a => a.id === dstId);
        if (srcAcc && dstAcc && srcAcc.id !== dstAcc.id) {
          const prevSrc = srcAcc.currentBalance;
          const prevDst = dstAcc.currentBalance;
          srcAcc.currentBalance = Math.max(0, Number((srcAcc.currentBalance - amt).toFixed(2)));
          if (dstAcc.pillar === 'LIABILITY') {
            dstAcc.currentBalance = Math.max(0, Number((dstAcc.currentBalance - amt).toFixed(2)));
          } else {
            dstAcc.currentBalance = Number((dstAcc.currentBalance + amt).toFixed(2));
          }
          if (window.PfmDomainEngine) {
            window.PfmDomainEngine.updateAsnbSnapshotOnBalanceChange(srcAcc, prevSrc, srcAcc.currentBalance, new Date());
            window.PfmDomainEngine.updateAsnbSnapshotOnBalanceChange(dstAcc, prevDst, dstAcc.currentBalance, new Date());
          }
          state.transactions.unshift({
            id: 'tx-' + Date.now(),
            date: todayStr,
            type: 'TRANSFER',
            amount: amt,
            personalAmount: 0.00,
            descEn: `Atomic Transfer: ${srcAcc.nameEn} -> ${dstAcc.nameEn} (RM 0 Expense Inflation)`,
            descZh: `原子转账：${srcAcc.nameZh} -> ${dstAcc.nameZh} (绝不虚增月度消费)`
          });
        }
      } else if (state.numpadMode === 'INSTALLMENT') {
        const liabId = document.getElementById('np-sel-liab')?.value || 'spaylater';
        const tenure = parseInt(document.getElementById('np-sel-tenure')?.value || '3', 10);
        const liabAcc = state.accounts.find(a => a.id === liabId);
        const slice = Number((amt / tenure).toFixed(2));
        if (liabAcc) {
          liabAcc.currentBalance = Number((liabAcc.currentBalance + amt).toFixed(2));
        }
        const schedules = [];
        for (let i = 1; i <= tenure; i++) {
          schedules.push({ number: i, dueDate: `2026-${String(9 + i).padStart(2, '0')}-19`, amount: slice, paid: false });
        }
        state.installmentPlans.unshift({
          id: 'plan-' + Date.now(),
          merchantEn: `${liabAcc ? liabAcc.nameEn : 'SPayLater'} (${tenure}M • ${fmtRM(amt)})`,
          merchantZh: `分期付款计划 (${liabAcc ? liabAcc.nameZh : 'SPayLater'} ${tenure}期 - ${fmtRM(amt)})`,
          totalPrincipal: amt,
          tenureMonths: tenure,
          monthlySlice: slice,
          schedules
        });
        state.categories[2].installmentSlice = Number((state.categories[2].installmentSlice + slice).toFixed(2));
        state.transactions.unshift({
          id: 'tx-' + Date.now(),
          date: todayStr,
          type: 'INSTALLMENT',
          amount: amt,
          personalAmount: slice,
          descEn: `Installment Plan (${tenure}M): +${fmtRM(amt)} Liability, only ${fmtRM(slice)}/mo in budget`,
          descZh: `新增 ${tenure}期分期：总负债 +${fmtRM(amt)}，当月预算仅计入 ${fmtRM(slice)}/月`
        });
      }
      closeNumpadModal();
      renderAll();
    }

    function payInstallmentSlice(planId, scheduleNum) {
      const plan = state.installmentPlans.find(p => p.id === planId);
      const bankB = state.accounts.find(a => a.id === 'bank-b');
      const spayAcc = state.accounts.find(a => a.id === 'spaylater');
      if (!plan) return;
      const sched = plan.schedules.find(s => s.number === scheduleNum);
      if (!sched || sched.paid) return;
      sched.paid = true;
      if (bankB) bankB.currentBalance = Math.max(0, Number((bankB.currentBalance - sched.amount).toFixed(2)));
      if (spayAcc) spayAcc.currentBalance = Math.max(0, Number((spayAcc.currentBalance - sched.amount).toFixed(2)));
      renderAll();
    }
    function settleFriendReimbursement(id) {
      const item = state.reimbursements.find(r => r.id === id);
      const bankA = state.accounts.find(a => a.id === 'bank-a');

      item.settled = true;

    function showBackupStatus(msgEn, msgZh, isError = false) {
      const el = document.getElementById('backup-status-msg');
      if (!el) return;
      el.textContent = loc(msgEn, msgZh);
      el.className = isError

      el.classList.remove('hidden');

    function downloadJsonBackup() {
      const jsonStr = window.PfmLocalDb
        ? window.PfmLocalDb.exportBackupJson(getSerializableState())
        : JSON.stringify(getSerializableState(), null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStamp = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `mypfm-backup-${dateStamp}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showBackupStatus(
        `✅ Exported backup file: mypfm-backup-${dateStamp}.json`,
        `✅ 已成功导出备份文件：mypfm-backup-${dateStamp}.json`
      );
    }

    function copyJsonBackupToClipboard() {
      const jsonStr = window.PfmLocalDb
        ? window.PfmLocalDb.exportBackupJson(getSerializableState())
        : JSON.stringify(getSerializableState(), null, 2);
      if (navigator.clipboard) {
        navigator.clipboard.writeText(jsonStr).then(() => {
          showBackupStatus('✅ Full JSON backup copied to clipboard!', '✅ 完整 JSON 备份数据已复制到剪贴板！');
        });
      }
    }

    function handleRestoreFileSelect(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        try {
          const text = e.target.result;
          const data = window.PfmLocalDb
            ? window.PfmLocalDb.validateAndExtractBackup(text)
            : JSON.parse(text);
          applySavedDataToState(data);
          saveToStorage();
          renderAll();
          showBackupStatus(
            `✅ Successfully restored ${state.accounts.length} accounts & all financial records into IndexedDB!`,
            `✅ 已成功从备份恢复 ${state.accounts.length} 个账户及所有分期/ASNB记录至手机本地数据库！`
          );
        } catch (err) {
          showBackupStatus(
            `❌ Invalid JSON backup file: ${err.message}`,
            `❌ 备份文件格式无效：${err.message}`,
            true
          );
        }
      };
      reader.readAsText(file);
    }

            : `<button onclick="settleFriendReimbursement('${r.id}')" class="px-3 py-1.5 rounded-lg bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold shrink-0">${loc('Settle (+RM 60)', '收回 (+RM 60)')}</button>`}
        </div>
      `).join('');

      document.getElementById('tax-view-title').textContent = dict.taxTitle;
      document.getElementById('tax-buckets-container').innerHTML = state.taxBuckets.map(b => {
        const pct = Math.min(100, Math.round((b.claimed / b.cap) * 100));
        return `
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3 space-y-1.5">
            <div class="flex justify-between text-xs font-bold">
              <span class="text-white truncate pr-2">${loc(b.nameEn, b.nameZh)}</span>
              <span class="text-emerald-400 shrink-0">${fmtRM(b.claimed)} / ${fmtRM(b.cap)}</span>
            </div>
            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full bg-gradient-to-r from-emerald-500 to-teal-400" style="width: ${pct}%"></div>
            </div>
          </div>
        `;
      }).join('');

      // TAB 2: Category Roll-Up Summaries
      document.getElementById('cat-rollup-title').textContent = dict.catTitle;
      document.getElementById('cat-rollup-subtitle').textContent = dict.catSubtitle;
      document.getElementById('category-rollup-container').innerHTML = state.categories.map(c => {
        const totalCommitted = Number((c.directSpent + c.installmentSlice).toFixed(2));
        const rem = Math.max(0, Number((c.budget - totalCommitted).toFixed(2)));
        const pct = Math.min(100, Math.round((totalCommitted / c.budget) * 100));
        const dailyCap = (rem / 12).toFixed(2);
        return `
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-2">
            <div class="flex items-center justify-between">
              <div>
                <span class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400">${c.code}</span>
                <h4 class="text-sm font-bold text-white mt-1">${loc(c.nameEn, c.nameZh)}</h4>
              </div>
              <div class="text-right">
                <p class="text-sm font-black text-white">${fmtRM(totalCommitted)} / ${fmtRM(c.budget)}</p>
                <p class="text-[11px] ${pct >= 80 ? 'text-amber-400' : 'text-emerald-400'}">${pct}% ${loc('used', '已用')}</p>
              </div>
            </div>
            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
              <div class="h-full ${pct >= 80 ? 'bg-amber-400' : 'bg-emerald-400'}" style="width: ${pct}%"></div>
            </div>
            <div class="flex justify-between text-[11px] text-slate-400 pt-1">
              <span>${loc('Direct:', '直接:')} ${fmtRM(c.directSpent)} • ${loc('Installment:', '分期:')} ${fmtRM(c.installmentSlice)}</span>
              <span class="text-sky-300 font-semibold">${loc('Cap:', '每日上限:')} RM ${dailyCap}/d</span>
            </div>
          </div>
        `;
      }).join('');

      // TAB 3: 30-Day Cashflow Projection Calendar
      document.getElementById('cal-view-title').textContent = dict.calTitle;
      document.getElementById('cal-view-subtitle').textContent = dict.calSubtitle;
      let runningBal = totalLiquid;
      const calDaysHtml = [];
      for (let d = 0; d < 30; d++) {
        const dateObj = new Date(2026, 9, 19 + d);
        const dateStr = dateObj.toISOString().slice(5, 10);
        const dayNum = dateObj.getDate();
        let eventLabel = '';
        let delta = 0;
        let badgeStyle = 'border-slate-800 bg-slate-950';

        if (d === 3) {
          delta -= 250;
          eventLabel = loc('AIA Insurance -RM 250', '保险扣款 -RM 250');
          badgeStyle = 'border-rose-500/50 bg-rose-950/20';
        } else if (dayNum === 25) {
          delta += state.netMonthlyIncome;
          eventLabel = loc(`Salary +${fmtRM(state.netMonthlyIncome)}`, `薪资入账 +${fmtRM(state.netMonthlyIncome)}`);
          badgeStyle = 'border-emerald-500/50 bg-emerald-950/20';
        } else if (dayNum === 28) {
          eventLabel = loc('Rule C: ASNB Sweep', '规则C：ASNB转入窗口');
          badgeStyle = 'border-teal-500/50 bg-teal-950/20';
        } else if (dayNum === 5) {
          delta -= 50;
          eventLabel = loc('SPayLater -RM 50', 'SPayLater -RM 50');
          badgeStyle = 'border-indigo-500/50 bg-indigo-950/20';
        }
        runningBal = Number((runningBal + delta).toFixed(2));
        calDaysHtml.push(`
          <div class="rounded-xl border p-2.5 flex flex-col justify-between min-h-[84px] ${badgeStyle}">
            <div class="flex items-center justify-between text-[11px]">
              <span class="font-bold text-slate-300">${dateStr}</span>
              <span class="text-[10px] text-slate-500">D+${d}</span>
            </div>
            ${eventLabel ? `<p class="text-[10px] font-bold text-amber-300 my-1">${eventLabel}</p>` : `<p class="text-[10px] text-slate-600 my-1">${loc('No bill', '无账单')}</p>`}
            <p class="text-xs font-extrabold text-white">${fmtRM(runningBal)}</p>
          </div>
        `);
      }
      document.getElementById('cashflow-calendar-grid').innerHTML = calDaysHtml.join('');

      // TAB 4: Virtual Envelopes
      document.getElementById('env-view-title').textContent = dict.envTitle;
      document.getElementById('env-formula-bar').textContent = dict.envFormula;
      document.getElementById('envelopes-breakdown-container').innerHTML = liquidAccs.map(a => {
        const envSum = (a.envelopes || []).reduce((s, e) => s + e.allocated, 0);
        const debitSum = (a.autoDebits || []).reduce((s, d) => s + d.amount, 0);
        const safe = calcSafeToSpend(a);
        return `
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-2.5">
            <div class="flex flex-wrap justify-between items-center gap-2">
              <h4 class="text-sm font-bold text-white">${loc(a.nameEn, a.nameZh)}</h4>
              <button onclick="openEditAccountModal('${a.id}')" class="px-2.5 py-1 rounded-lg bg-sky-500/20 text-sky-300 text-xs font-bold">
                ${loc('✎ Edit Envelopes & Balance', '✎ 编辑信封与余额')}
              </button>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 text-xs">
              <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                <span class="text-slate-400 block">${loc('Current Balance', '账面当前余额')}</span>
                <strong class="text-white">${fmtRM(a.currentBalance)}</strong>
              </div>
              <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                <span class="text-slate-400 block">${loc('Min Floor (Rule A)', '最低限额 (Rule A)')}</span>
                <strong class="text-rose-300">- ${fmtRM(a.minBalanceLimit)}</strong>
              </div>
              <div class="bg-slate-900 p-2.5 rounded-lg border border-slate-800">
                <span class="text-slate-400 block">${loc('Virtual Envelopes', '储蓄信封已锁定')}</span>
                <strong class="text-sky-300">- ${fmtRM(envSum)}</strong>
              </div>
              <div class="bg-slate-900 p-2.5 rounded-lg border border-emerald-500/30">
                <span class="text-emerald-300 block">${loc('Safe-to-Spend', '可自由支配')}</span>
                <strong class="text-emerald-400">${fmtRM(safe)}</strong>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // TAB 5: Installments & DSR
      document.getElementById('inst-view-title').textContent = dict.instTitle;
      document.getElementById('inst-view-subtitle').textContent = dict.instSubtitle;
      document.getElementById('btn-create-spaylater').textContent = dict.createSpayLaterBtn;

      const dsrPct = state.netMonthlyIncome > 0 ? ((monthlyInstCommitment / state.netMonthlyIncome) * 100).toFixed(2) : '0.00';
      document.getElementById('dsr-gauge-panel').innerHTML = `
        <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 flex flex-wrap items-center justify-between gap-3">
          <div>
            <p class="text-xs text-slate-400">${loc('Debt Service Ratio (DSR %) = (Monthly Debt & BNPL / Net Income) × 100', '债务偿还比率 (DSR %) = (每月分期与贷款月供 / 净收入) × 100')}</p>
            <p class="text-base sm:text-lg font-black text-emerald-400 mt-1">DSR: ${dsrPct}% (${fmtRM(monthlyInstCommitment)} / ${fmtRM(state.netMonthlyIncome)})</p>
          </div>
          <span class="px-3 py-1 rounded-full bg-emerald-500/20 text-emerald-300 text-xs font-bold">${loc('Healthy DSR (<= 30%)', '债务比率健康 (<= 30%)')}</span>
        </div>
      `;

      document.getElementById('installment-plans-container').innerHTML = state.installmentPlans.map(p => {
        const paidCount = p.schedules.filter(s => s.paid).length;
        const remaining = p.schedules.filter(s => !s.paid).reduce((s, x) => s + x.amount, 0);
        const progressText = isZh()
          ? `分期付款计划 (${p.tenureMonths}期)：已还 ${paidCount}/${p.tenureMonths} 期，剩余 ${fmtRM(remaining)}`
          : `${paidCount} of ${p.tenureMonths} paid, ${fmtRM(remaining)} remaining`;

        return `
          <div class="bg-slate-950 border border-slate-800 rounded-xl p-3.5 space-y-3">
            <div class="flex flex-wrap items-center justify-between gap-2">
              <div>
                <h4 class="text-sm font-bold text-white">${loc(p.merchantEn, p.merchantZh)}</h4>
                <p class="text-xs text-indigo-300 font-semibold mt-0.5">${progressText}</p>
              </div>
              <span class="text-xs bg-indigo-500/20 text-indigo-200 px-2.5 py-1 rounded-lg font-bold">
                ${fmtRM(p.monthlySlice)}/mo
              </span>
            </div>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
              ${p.schedules.map(s => `
                <div class="p-2.5 rounded-lg border ${s.paid ? 'border-emerald-500/40 bg-emerald-950/20' : 'border-slate-800 bg-slate-900'} flex items-center justify-between">
                  <div>
                    <p class="text-xs font-bold text-white">${loc(`Slice #${s.number}`, `第 ${s.number}/${p.tenureMonths} 期`)}</p>
                    <p class="text-[11px] text-slate-400">${s.dueDate} • ${fmtRM(s.amount)}</p>
                  </div>
                  ${s.paid
                    ? `<span class="text-[11px] font-bold text-emerald-400">${loc('PAID', '已结清')}</span>`
                    : `<button onclick="payInstallmentSlice('${p.id}', ${s.number})" class="px-2.5 py-1 rounded bg-indigo-500 hover:bg-indigo-400 text-white text-[11px] font-bold">${loc('Pay', '还款')}</button>`}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');

      // TAB 6: ASNB Dividend Projector View
      document.getElementById('asnb-view-title').textContent = dict.asnbTitle;
      document.getElementById('asnb-rule-formula').textContent = dict.asnbFormula;
      document.getElementById('btn-sim-asnb-after1st').textContent = dict.simAsnbAfter1st;

      const asnbAcc = state.accounts.find(a => a.id === 'asnb-fixed') || investAccs[0];
      const gxAcc = state.accounts.find(a => a.id === 'gxbank') || liquidAccs[0];
      if (asnbAcc && gxAcc) {
        const monthlyDiv = ((asnbAcc.lowestMonthlyBalance * (asnbAcc.annualRate / 100)) / 12).toFixed(2);
        const nextMonthDiv = ((asnbAcc.currentBalance * (asnbAcc.annualRate / 100)) / 12).toFixed(2);
        const projectedAnnualDiv = (Number(monthlyDiv) * 10 + Number(nextMonthDiv) * 2).toFixed(2);
        const gxDailyInterest = (gxAcc.currentBalance * ((gxAcc.annualRate || 3) / 100 / 365)).toFixed(2);

        document.getElementById('asnb-cards-container').innerHTML = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
            <div class="bg-slate-950 border border-teal-500/40 rounded-xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-teal-300">${loc(asnbAcc.nameEn, asnbAcc.nameZh)}</h3>
                <button onclick="openEditAccountModal('${asnbAcc.id}')" class="px-2.5 py-1 rounded-lg bg-teal-500/20 text-teal-300 text-xs font-bold">${dict.editBtnLabel}</button>
              </div>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div class="bg-slate-900 p-2.5 rounded-lg">
                  <span class="text-slate-400 block">${loc('Current Balance', '当前账户总余额')}</span>
                  <strong class="text-white text-sm">${fmtRM(asnbAcc.currentBalance)}</strong>
                </div>
                <div class="bg-slate-900 p-2.5 rounded-lg border border-teal-500/30">
                  <span class="text-teal-300 block">${loc('Lowest Monthly Bal', '本月最低持有余额')}</span>
                  <strong class="text-teal-400 text-sm">${fmtRM(asnbAcc.lowestMonthlyBalance)}</strong>
                </div>
                <div class="bg-slate-900 p-2.5 rounded-lg">
                  <span class="text-slate-400 block">${loc('Current Month Dividend', '本月已锁定分红')}</span>
                  <strong class="text-emerald-400 text-sm">RM ${monthlyDiv}</strong>
                </div>
                <div class="bg-slate-900 p-2.5 rounded-lg">
                  <span class="text-slate-400 block">${loc('Projected Year-End', '预计全年总派息')}</span>
                  <strong class="text-emerald-400 text-sm">RM ${projectedAnnualDiv}</strong>
                </div>
              </div>
            </div>

            <div class="bg-slate-950 border border-slate-800 rounded-xl p-4 space-y-3">
              <div class="flex items-center justify-between">
                <h3 class="text-sm font-bold text-sky-300">${loc(gxAcc.nameEn, gxAcc.nameZh)}</h3>
                <button onclick="openEditAccountModal('${gxAcc.id}')" class="px-2.5 py-1 rounded-lg bg-sky-500/20 text-sky-300 text-xs font-bold">${dict.editBtnLabel}</button>
              </div>
              <p class="text-xs font-mono text-slate-400">DailyInterest = EndOfDayBalance × (AnnualRate / 100 / 365)</p>
              <div class="grid grid-cols-2 gap-2 text-xs">
                <div class="bg-slate-900 p-2.5 rounded-lg">
                  <span class="text-slate-400 block">${loc('End-of-Day Balance', '日终结算余额')}</span>
                  <strong class="text-white text-sm">${fmtRM(gxAcc.currentBalance)}</strong>
                </div>
                <div class="bg-slate-900 p-2.5 rounded-lg">
                  <span class="text-slate-400 block">${loc('Daily Interest Earned', '每日复利收益')}</span>
                  <strong class="text-sky-400 text-sm">RM ${gxDailyInterest} / ${loc('day', '天')}</strong>
                </div>
              </div>
            </div>
          </div>
        `;
      }

      // TAB 7: Alert Notification Center
      document.getElementById('alerts-center-title').textContent = dict.alertsCenterTitle;
      document.getElementById('alerts-center-subtitle').textContent = dict.alertsCenterSubtitle;
      document.getElementById('btn-sim-tng').textContent = dict.simTng;
      document.getElementById('btn-sim-autodebit').textContent = dict.simAutoDebit;
      document.getElementById('btn-sim-reset').textContent = dict.simReset;

      const alertsContainer = document.getElementById('alerts-container');
      alertsContainer.innerHTML = '';
      alerts.forEach((a, idx) => {
        const borderMap = {
          rose: 'border-rose-500/50 bg-rose-950/30',
          amber: 'border-amber-500/50 bg-amber-950/30',
          emerald: 'border-emerald-500/50 bg-emerald-950/30'
        };
        const card = document.createElement('div');
        card.className = `rounded-xl border p-3.5 flex flex-col justify-between ${borderMap[a.color]}`;
        card.innerHTML = `
          <div>
            <div class="flex items-center justify-between text-[10px] font-mono text-slate-400 mb-1">
              <span>${a.ruleCode}</span>
              <span>${a.translationKey}</span>
            </div>
            <h3 class="text-sm font-bold text-white mb-1">${a.title}</h3>
            <p class="text-xs text-slate-300 leading-relaxed">${a.body}</p>
          </div>
          ${a.actionLabel ? `<button id="alert-act-${idx}" class="mt-3 w-full py-2 px-3 rounded-lg bg-white/10 hover:bg-white/20 text-xs font-bold text-white border border-white/15 transition-all">${a.actionLabel}</button>` : ''}
        `;
        alertsContainer.appendChild(card);
        if (a.actionLabel && a.onAction) {
          document.getElementById(`alert-act-${idx}`).onclick = a.onAction;
        }
      });

      // TAB 8: Standalone IndexedDB & JSON Backup / Restore Center
      document.getElementById('backup-view-title').textContent = dict.backupTitle;
      document.getElementById('backup-view-subtitle').textContent = dict.backupSubtitle;
      document.getElementById('backup-export-title').textContent = dict.backupExportTitle;
      document.getElementById('backup-export-desc').textContent = dict.backupExportDesc;
      document.getElementById('btn-download-json').textContent = dict.btnDownloadJson;
      document.getElementById('btn-copy-json').textContent = dict.btnCopyJson;
      document.getElementById('backup-import-title').textContent = dict.backupImportTitle;
      document.getElementById('backup-import-desc').textContent = dict.backupImportDesc;
      document.getElementById('btn-upload-json').textContent = dict.btnUploadJson;
      document.getElementById('btn-check-pwa-update').textContent = dict.btnCheckUpdate;
      document.getElementById('tx-history-title').textContent = dict.txHistoryTitle;

      const txListEl = document.getElementById('tx-history-list');
      if (txListEl) {
        txListEl.innerHTML = (state.transactions || []).map(tx => `
          <div class="bg-slate-900 border border-slate-800 rounded-xl p-2.5 flex items-center justify-between gap-2 text-xs">
            <div class="min-w-0">
              <span class="px-1.5 py-0.5 rounded bg-slate-800 text-[10px] font-mono text-emerald-300">${tx.type}</span>
              <span class="text-[11px] text-slate-400 ml-1">${tx.date}</span>
              <p class="text-white font-semibold truncate mt-0.5">${loc(tx.descEn, tx.descZh)}</p>
            </div>
            <div class="text-right shrink-0">
              <p class="font-black text-white">${fmtRM(tx.amount)}</p>
              <p class="text-[10px] text-slate-400">${loc('Budget Impact:', '计入消费:')} ${fmtRM(tx.personalAmount)}</p>
            </div>
          </div>
        `).join('');
      }

      saveToStorage();
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').then((reg) => {
          swRegistrationRef = reg;
          reg.addEventListener('updatefound', () => {
            const newWorker = reg.installing;
            if (!newWorker) return;
            newWorker.addEventListener('statechange', () => {
              if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                const banner = document.getElementById('pwa-update-banner');
                if (banner) banner.classList.remove('hidden');
              }
            });
          });
        }).catch(() => {});
      });
    }

    renderAll();
  </script>
</body>
</html>
